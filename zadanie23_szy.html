
<html>
<head>
    <script language="JavaScript">
    function drabina_jackiewicz(){
        var d_jac = parseFloat(document.getElementsByName('d')[0].value);
        var x_jac = parseFloat(document.getElementsByName('x')[0].value);

        drabina_jac = Math.sqrt(Math.pow(d_jac, 2) + Math.pow(x_jac, 2));

        alert("Drabina = " + drabina_jac.toFixed(2) + " cm");
        document.getElementsByName('drabina')[0].value = drabina_jac.toFixed(2);
    }

    function alfa_jackiewicz(){
        var d_jac = parseFloat(document.getElementsByName('d')[0].value);
        var x_jac = parseFloat(document.getElementsByName('x')[0].value);

        var sin_alfa_jac = d_jac/drabina_jac;
        var alfa_jac = (Math.asin(sin_alfa_jac)) * 180 / Math.PI;

        alert("Alfa = " + alfa_jac.toFixed(2));
        document.getElementsByName('alfa')[0].value = alfa_jac.toFixed(2);
    }
    </script>
</head>
<body>
    <form name="formularz" onsubmit="drabina_jackiewicz(); alfa_jackiewicz(); return false">
            Podaj d=
        <input size="6" name="d" id="input_d">
            Podaj x=
        <input size="6" name="x" id="input_x"><br><br>
        <input TYPE="submit" Value="oblicz"><br><br>
            Drabina=
        <input size="6" name="drabina"><br>
            Alfa=
        <input size="6" name="alfa">
    </form>
</body>
</html>
