<html>
<head>
    <script type="text/javascript">
        var Monitor = {
            producent: 'Samsung',
            matryca: 'OLED',
            odswiezanie: '144Hz',
            monitor_wyswietl_jackiewicz: function (){
                document.write(
                    "Producent: " + this.producent + "<br>" +
                    "Typ matrycy: " + this.matryca + "<br>" +
                    "Odświeżanie: " + this.odswiezanie
                );
            }
        }

        Monitor.monitor_wyswietl_jackiewicz();
    </script>
</head>
<body>
    <br>---<br>
    Programowanie obiektowe. <br>
    Obiekt to monitor<br>
    Pola:<br>
    producent<br>
    matryca<br>
    odswiezanie<br>
    metoda: monitor_wyswietl_jackiewicz<br>
</body>
</html>
