<textarea cols="100" rows="26">
<!DOCTYPE html>
<html>
<head>
    <title>jackiewicz 3G</title>
</head>
<body>

    <script>
        var odl_szy = parseFloat(prompt("odl=",""));
        var s_szy = parseFloat(prompt("s=",""));
        
        var h_szy = Math.sqrt(s_szy*s_szy - odl_szy*odl_szy)
        var kat_szy_rad = Math.asin(h_szy/s_szy);
        var kat_szy = kat_szy_rad * 180 / Math.PI;

        document.write("odl = " + odl_szy + "<br>");
        document.write("s = " + s_szy + "<br>");
        document.write("h = " + h_szy.toFixed(2) + "<br>");
        document.write("kąt = " + kat_szy.toFixed(2) + "° <br>");
    </script>
</body>
</html>
<!-- Jackiewicz 3G -->
