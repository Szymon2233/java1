<textarea cols="100" rows="26">
<!DOCTYPE html>
<html>
<head>
    <title>jackiewicz 3G</title>
</head>
<body>
    <div style="color: green; font-size: 28px;">
        <script>
            var N0_szy = parseFloat(prompt("N0=",""));
            var t_szy = parseFloat(prompt("t=",""));
            var T12_szy = parseFloat(prompt("T1/2=",""));

            var lambda_szy = Math.log(2) / T12_szy;
            var N_szy = N0_szy * Math.pow(Math.E, -lambda_szy*t_szy);

            document.write("N0=" + N0_szy + "<br>");
            document.write("t=" + t_szy + "<br>");
            document.write("T1/2=" + T12_szy + "<br>");
            document.write("lambda=" + lambda_szy.toFixed(7) + "<br>");
            document.write("N=" + N_szy.toFixed(7) + "<br>");
        </script>
    </div>
</body>
</html>
<!-- Szymon jackiewicz 3G -->
